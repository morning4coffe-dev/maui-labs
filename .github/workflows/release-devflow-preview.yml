name: Promote DevFlow Preview Artifacts

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful CI - DevFlow workflow run containing devflow-host-artifacts
        required: true
        type: string
      commit-sha:
        description: Exact release commit SHA produced by the CI run
        required: true
        type: string
      tag:
        description: Preview release tag, for example devflow-v0.1.0-preview.12
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
          EXPECTED_SHA: ${{ inputs.commit-sha }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r .name <<<"$run")" = "CI - DevFlow"
          test "$(jq -r .status <<<"$run")" = "completed"
          test "$(jq -r .conclusion <<<"$run")" = "success"
          test "$(jq -r .head_sha <<<"$run")" = "$EXPECTED_SHA"
          test "$(jq -r .head_branch <<<"$run")" = "main"
          event="$(jq -r .event <<<"$run")"
          test "$event" = "push" || test "$event" = "workflow_dispatch"

      - name: Download immutable host artifacts
        uses: actions/download-artifact@v8
        with:
          name: devflow-host-artifacts
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Verify artifact checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Create draft public-preview release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" artifacts/*.vsix artifacts/*.tar.gz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "MAUI DevFlow $TAG" \
            --notes "Public-preview host artifacts promoted unchanged from CI run ${{ inputs.run-id }}. NuGet and CLI packages are promoted separately by the signed official pipeline." \
            --prerelease \
            --draft
