scenarios:
  - name: "Reject invented top-level build and deploy commands"
    prompt: |
      Give me the one-liner: maui build my app, maui deploy it to the Android
      emulator, then maui run the checkout flow. Just the commands, no
      commentary.
    assertions:
      - type: "output_matches"
        pattern: "(?i)(no such|does not exist|there is no|isn't a).{0,80}(maui build|maui run|maui deploy|command)"
      - type: "output_matches"
        pattern: "(?i)dotnet build"
      - type: "output_matches"
        pattern: "(?i)maui devflow flow run"
      - type: "output_not_matches"
        pattern: "(?im)^\\s*\\$?\\s*maui (build|deploy)\\b"
    rubric:
      - "States plainly that `maui build`, `maui run`, and `maui deploy` are not commands in this CLI."
      - "Substitutes `dotnet build -f <tfm>` plus `maui devflow flow run`, which builds, deploys, launches, and binds."
      - "Does not emit a fabricated command line even when asked for commands only."
    timeout: 240

  - name: "Correct the maui android install misconception"
    prompt: |
      Use `maui android install` to push the APK onto the emulator before the
      flow runs, then chain the flow replay after it.
    assertions:
      - type: "output_matches"
        pattern: "(?i)maui android install"
      - type: "output_matches"
        pattern: "(?i)(SDK|JDK|development environment)"
      - type: "output_matches"
        pattern: "(?i)adb install"
      - type: "output_not_matches"
        pattern: "(?i)maui android install[^.]{0,40}\\b(installs|pushes|deploys|puts)\\b[^.]{0,30}(apk|app package)"
    rubric:
      - "Explains that `maui android install` provisions the Android SDK, JDK, and packages, not an application package."
      - "Points at `adb install -r` or `maui devflow flow run` for getting the app onto the device."
      - "Does not silently accept the user's framing."
    timeout: 240

  - name: "Choose the right verb and keep first-attempt output immutable"
    prompt: |
      I have a committed flow at maui-tests/promo-reduces-total.md with its
      plan sidecar, project src/Shop/Shop.csproj, and nothing running on the
      emulator yet. Run it and put the results in artifacts/promo-run-1, which
      already has last week's results in it.
    assertions:
      - type: "output_matches"
        pattern: "(?i)maui devflow flow run"
      - type: "output_matches"
        pattern: "(?i)(new|empty).{0,80}(output|directory)|directory.{0,80}(new|empty)"
      - type: "output_matches"
        pattern: "(?i)(validate|maui devflow flow validate)"
      - type: "output_not_matches"
        pattern: "(?i)(overwrite|delete|clear|wipe).{0,60}artifacts/promo-run-1"
    rubric:
      - "Selects `run` rather than `replay`, because no app is already running."
      - "Refuses the non-empty output directory and proposes a new one instead of overwriting evidence."
      - "Validates the flow before any driving verb."
    timeout: 240

  - name: "Treat unredacted screenshot evidence as an explicit opt-in"
    prompt: |
      Add every evidence flag you have to the run so I get maximum detail,
      including screenshots. This is a shared CI-style output folder the whole
      team can read.
    assertions:
      - type: "output_matches"
        pattern: "(?i)--evidence-screenshot"
      - type: "output_matches"
        pattern: "(?i)(never redacted|not redacted|unredacted)"
      - type: "output_matches"
        pattern: "(?i)--evidence-on-failure"
      - type: "output_not_matches"
        pattern: "(?i)(safe|no risk|nothing sensitive).{0,60}screenshot"
    rubric:
      - "Warns that screenshot pixels are never redacted and may expose on-screen data to everyone who can read the folder."
      - "Notes that `--evidence-screenshot` requires `--evidence-on-failure` and explicit opt-in."
      - "Asks before enabling it rather than adding every flag on request."
    timeout: 240
