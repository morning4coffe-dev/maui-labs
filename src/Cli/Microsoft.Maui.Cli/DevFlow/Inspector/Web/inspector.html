<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevFlow Inspector</title>
  <!-- Base tag ensures relative URLs resolve correctly even when the page is
       opened at /inspector/{id} without a trailing slash. Without this, the
       browser would resolve devflow.css as /inspector/devflow.css (treating
       {id} as a filename) instead of /inspector/{id}/devflow.css. -->
  <base href="./">
  <link rel="stylesheet" href="devflow.css">
</head>
<body>
  <!-- Inline SVG icon sprite (stroke = currentColor so every icon inherits the button's themed
       text color). Referenced via <use href="#i-*">. Replaces emoji/geometric glyphs. -->
  <svg width="0" height="0" class="df-sprite" aria-hidden="true" focusable="false"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M21 12h-8"/><path d="M21 6H8"/><path d="M21 18h-8"/><path d="M3 6v4c0 1.1.9 2 2 2h3"/><path d="M3 10v6c0 1.1.9 2 2 2h3"/></symbol>
    <symbol id="i-bounds" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 4"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="7"/></symbol>
    <symbol id="i-assert" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 3v18l14-9z"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-source" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-copilot" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15v4"/><path d="M21 17h-4"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <!-- Element-type icons for the visual tree (mapped by type in devflow.js). -->
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/><path d="M6 6h.01"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
    <symbol id="i-button" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"/></symbol>
    <symbol id="i-input" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2"/><path d="M9 19h6"/><path d="M12 5v14"/></symbol>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
  </svg>

  <div id="df-app">
    <div id="df-toolbar">
      <div class="df-modes" role="group" aria-label="Interaction mode">
        <button id="df-mode-interact" class="df-mode-btn df-active" title="Click drives the app (tap, scroll, gestures). Alt/Shift+Click selects.">Interact</button>
        <button id="df-mode-inspect" class="df-mode-btn" title="Click selects an element (does not tap the app)">Inspect</button>
      </div>
      <span class="df-sep"></span>
      <button id="df-toggle-tree" class="df-tool-btn df-active" title="Show/hide the element tree" aria-expanded="true" aria-controls="df-tree"><svg class="df-ic"><use href="#i-tree"/></svg><span class="df-btn-label">Tree</span></button>
      <button id="df-toggle-bounds" class="df-tool-btn" title="Outline every element"><svg class="df-ic"><use href="#i-bounds"/></svg><span class="df-btn-label">Bounds</span></button>
      <button id="df-toggle-fit" class="df-tool-btn df-active" title="Fit the app view to the available space (toggle to see it at 1:1 actual size)" aria-pressed="true"><svg class="df-ic"><use href="#i-fit"/></svg><span class="df-btn-label">Fit</span></button>
      <span class="df-sep"></span>
      <button id="df-toggle-record" class="df-tool-btn" title="Record your interactions into a replayable Markdown test. Enabled when you're driving the app — take control if another session is Read-only."><svg class="df-ic df-ic-rec"><use href="#i-record"/></svg><span class="df-btn-label">Record</span></button>
      <button id="df-assert" class="df-tool-btn" title="Add an assertion on the selected element (its Text = current value, or that it exists) so the test validates, not just reproduces. Enabled while recording with an element selected." disabled><svg class="df-ic"><use href="#i-assert"/></svg><span class="df-btn-label">Assert</span></button>
      <button id="df-toggle-replay" class="df-tool-btn" title="Replay the recorded test against the live app (drives the app). Enabled after you record and stop a test." disabled><svg class="df-ic"><use href="#i-replay"/></svg><span class="df-btn-label">Replay</span></button>
      <button id="df-goto-checkpoint" class="df-tool-btn" title="Return to the route captured when recording started (navigation only; data is not reset). Enabled after a recording captures a start route." disabled><svg class="df-ic"><use href="#i-route"/></svg><span class="df-btn-label">Start route</span></button>
      <span class="df-sep"></span>
      <button id="df-open-source" class="df-tool-btn" title="Open the selected element's XAML source in your editor. Enabled when the selected element is defined in XAML with source mapping available." disabled><svg class="df-ic"><use href="#i-source"/></svg><span class="df-btn-label">Source</span></button>
      <button id="df-send-copilot" class="df-tool-btn" title="Send the selected element / recording context to Copilot (the element's UI text and any recorded steps are shared). Enabled once you select an element or record a test." disabled><svg class="df-ic"><use href="#i-copilot"/></svg><span class="df-btn-label">Copilot</span></button>
      <button id="df-toggle-dock" class="df-tool-btn" title="Show app data: Logs, Network, Preferences, Device, Sensors, Files"><svg class="df-ic"><use href="#i-data"/></svg><span class="df-btn-label">Data</span></button>
      <span id="df-presence" class="df-presence" title="Who can drive this app right now"></span>
      <button id="df-take-control" class="df-tool-btn df-hidden" title="Another session is driving this app, click to take control"><svg class="df-ic"><use href="#i-key"/></svg><span class="df-btn-label">Take control</span></button>
      <span class="df-spacer"></span>
      <span id="df-status" class="df-status" role="status" aria-live="polite"></span>
    </div>
    <div id="df-body">
      <aside id="df-tree-pane" class="df-pane">
        <div class="df-pane-header"><span class="df-pane-title">Visual tree</span><span id="df-tree-count" class="df-pane-count"></span></div>
        <div id="df-tree" aria-label="Element tree"></div>
      </aside>
      <section id="df-view-pane" class="df-pane df-pane-grow">
        <div class="df-pane-header"><span class="df-pane-title">Screenshot</span></div>
        <div id="df-viewport-wrap">
          <div id="df-stage">
            <div id="app-viewport" data-width="{{VIEWPORT_WIDTH}}" data-height="{{VIEWPORT_HEIGHT}}" data-root-offset-x="{{ROOT_OFFSET_X}}" data-root-offset-y="{{ROOT_OFFSET_Y}}" style="width:{{VIEWPORT_WIDTH}}px; height:{{VIEWPORT_HEIGHT}}px;">
              {{SCREENSHOT}}
              {{ELEMENTS}}
            </div>
          </div>
        </div>
      </section>
      <aside id="df-props-pane" class="df-pane df-hidden">
        <div class="df-pane-header"><span class="df-pane-title">Properties</span><span id="df-props-el" class="df-pane-el"></span><button id="df-props-close" class="df-icon-btn df-pane-close" title="Close properties"><svg class="df-ic"><use href="#i-close"/></svg></button></div>
        <div id="df-props" aria-label="Properties"></div>
      </aside>
    </div>
    <div id="df-timeline" class="df-hidden" aria-label="Recording timeline">
      <span class="df-tl-title"><svg class="df-ic df-ic-rec"><use href="#i-record"/></svg><span id="df-timeline-title-text">Recording</span></span>
      <div id="df-timeline-steps" class="df-tl-steps"></div>
      <span id="df-timeline-meta" class="df-tl-meta"></span>
      <button id="df-timeline-close" class="df-icon-btn" title="Dismiss timeline"><svg class="df-ic"><use href="#i-close"/></svg></button>
    </div>
    <div id="df-dock" class="df-hidden" aria-label="App data">
      <div id="df-dock-tabs" role="tablist">
        <button class="df-dock-tab df-active" data-tab="logs" role="tab">Logs</button>
        <button class="df-dock-tab" data-tab="network" role="tab">Network</button>
        <button class="df-dock-tab" data-tab="preferences" role="tab">Preferences</button>
        <button class="df-dock-tab" data-tab="device" role="tab">Device</button>
        <button class="df-dock-tab" data-tab="sensors" role="tab">Sensors</button>
        <button class="df-dock-tab" data-tab="files" role="tab">Files</button>
        <button class="df-dock-tab" data-tab="webview" role="tab">WebView</button>
        <span class="df-spacer"></span>
        <span id="df-dock-meta" class="df-dock-meta"></span>
        <button id="df-dock-refresh" class="df-icon-btn" title="Refresh this tab"><svg class="df-ic"><use href="#i-refresh"/></svg></button>
        <button id="df-dock-close" class="df-icon-btn" title="Hide the data dock"><svg class="df-ic"><use href="#i-close"/></svg></button>
      </div>
      <div id="df-dock-body"></div>
    </div>
  </div>

  <script src="devflow.js"></script>
</body>
</html>
