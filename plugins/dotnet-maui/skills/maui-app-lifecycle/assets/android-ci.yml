# Copy into the app repository and set the actual app/test paths and identities.
# Copy all lifecycle scripts to eng/maui-agent/; commit an actual smoke flow.
name: MAUI app CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: maui-app-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_PROJECT: TaskApp/TaskApp.csproj
  TEST_PROJECT: TaskApp.Tests/TaskApp.Tests.csproj
  APP_NAME: TaskApp
  APP_PACKAGE: com.example.taskapp
  TFM: net10.0-android
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Source-pinned CLI includes the current Inspector/flow MCP surface.
      - uses: actions/checkout@v6
        with:
          repository: dotnet/maui-labs
          ref: 391101d3f39c747cf6c23253e669382309083618
          path: .maui-tools/maui-labs
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: .maui-tools/maui-labs/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install toolchain
        run: dotnet workload install maui-android
      - name: Build pinned MAUI CLI
        working-directory: .maui-tools/maui-labs
        run: |
          dotnet build src/Cli/Microsoft.Maui.Cli/Microsoft.Maui.Cli.csproj -c Release -f net10.0
          echo "$PWD/artifacts/bin/Microsoft.Maui.Cli/Release/net10.0" >> "$GITHUB_PATH"
      - name: Host tests
        run: dotnet test "$TEST_PROJECT" -c Release --logger 'trx;LogFileName=unit.trx' --results-directory .maui-agent/test-results
      - name: Build Debug and Release
        run: |
          dotnet build "$APP_PROJECT" -f "$TFM" -c Debug -p:TargetFrameworks="$TFM"
          dotnet build "$APP_PROJECT" -f "$TFM" -c Release -p:TargetFrameworks="$TFM"
      - name: Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            maui devflow broker start
            adb reverse tcp:19223 tcp:19223
            dotnet build "$APP_PROJECT" -f "$TFM" -c Debug -t:Install -p:TargetFrameworks="$TFM"
            adb shell monkey -p "$APP_PACKAGE" 1
            adb forward tcp:9223 tcp:9223
            for attempt in $(seq 1 60); do
              if maui devflow agent status --agent-port 9223 --json; then break; fi
              if [ "$attempt" = 60 ]; then exit 1; fi
              sleep 1
            done
            python3 eng/maui-agent/devflow_check.py --app "$APP_NAME" --platform android --agent-port 9223 --flow maui-tests/smoke.md --output .maui-agent/ui/report.json
      - name: Record environment
        if: always()
        run: |
          mkdir -p .maui-agent
          git rev-parse HEAD > .maui-agent/revision.txt
          dotnet --info > .maui-agent/dotnet.txt
          dotnet workload list > .maui-agent/workloads.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence-${{ github.sha }}
          path: .maui-agent/
          include-hidden-files: true
          retention-days: 7
