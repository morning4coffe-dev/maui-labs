name: CI - Cli

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'src/Cli/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Devices/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Driver/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Testing/**'
      - 'tests/DevFlow/PackageConsumer/**'
      - 'src/Go/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'src/Cli/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Devices/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Driver/**'
      - 'src/DevFlow/Microsoft.Maui.DevFlow.Testing/**'
      - 'tests/DevFlow/PackageConsumer/**'
      - 'src/Go/**'
      - 'eng/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      project-path: src/Cli/Cli.slnf
      project-name: cli
      run-tests: true
      pack: true
      install-workloads: false
      collect-coverage: true
      coverage-threshold: '30'
      # No os override, so this runs the default macOS + Windows matrix. _build.yml collects and
      # gates coverage on coverage-os (windows-latest) only; the macOS leg still runs the tests,
      # because the thresholds are calibrated against one OS and src/Cli is full of
      # OperatingSystem.IsWindows/IsMacOS branches.
