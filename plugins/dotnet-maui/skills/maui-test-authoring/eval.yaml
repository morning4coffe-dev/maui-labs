scenarios:
  - name: "Author a validating UI test for adding a todo"
    prompt: |
      I have a running .NET MAUI todo app connected to DevFlow. Write me a reusable UI test that
      adds a todo item "Buy milk" and confirms it was added. I want to be able to re-run it later to
      catch regressions.
    assertions:
      - type: "output_contains"
        value: "maui_flow_record_start"
      - type: "output_contains"
        value: "maui_flow_replay"
      - type: "output_matches"
        pattern: "assert|assertsJson|propEquals"
    rubric:
      - "Records the workflow with maui_flow_record_start / record_step and stops to write a .md"
      - "Adds at least one assertion (assert step or propEquals) so the test VALIDATES, not just reproduces"
      - "Replays with maui_flow_replay to verify, and uses AutomationId-based durable selectors"
      - "Does not present a tap-only recording as a complete test"
    timeout: 150

  - name: "Recording replays but validates nothing"
    prompt: |
      I recorded a DevFlow flow of my login screen and it replays fine, but a teammate says it isn't
      really a test. What am I missing and how do I fix it?
    assertions:
      - type: "output_contains"
        value: "assertion"
      - type: "output_matches"
        pattern: "propEquals|exists|routeIs"
    rubric:
      - "Explains that a recording without assertions only reproduces steps and does not validate state"
      - "Shows how to add an assertion (assert step with propEquals/exists/routeIs, or maui_assert)"
      - "Recommends asserting a value the workflow actually changes"
    timeout: 120

  - name: "Replay step cannot resolve its target"
    prompt: |
      When I replay my saved DevFlow test, one step fails with the target not resolving. The element
      is clearly on screen. Why does replay fail and how do I make it stable?
    assertions:
      - type: "output_contains"
        value: "AutomationId"
      - type: "output_matches"
        pattern: "fragile|durable"
    rubric:
      - "Identifies a fragile (non-AutomationId) selector as the cause"
      - "Explains the durable selector precedence AutomationId > text > id"
      - "Recommends adding an AutomationId in the app and re-recording the step, or maui_flow_validate"
    timeout: 120

  - name: "Record a test by clicking in the inspector"
    prompt: |
      Can I record a DevFlow regression test just by clicking through my MAUI app in the inspector,
      and add a check that a value is correct, without writing tool calls by hand?
    assertions:
      - type: "output_contains"
        value: "Record"
      - type: "output_matches"
        pattern: "Assert|Replay"
    rubric:
      - "Explains the inspector Record button captures human interactions as durable steps"
      - "Explains selecting an element and clicking Assert adds a Text/exists assertion"
      - "Mentions Replay to validate and returning to the start route before re-recording"
    timeout: 120
